<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MP3 Skidač</title>
<style>
:root{
  --bg:#0E1014;--card:#171A21;--active:#1D2029;--border:#262A33;--border2:#333844;--hover:#20242C;
  --chip:#262A33;--chip-h:#2F3440;--text:#F2F3F5;--text2:#C2C7D0;--muted:#9AA0AB;--dim:#6B7280;
  --accent:#F5A524;--accent-h:#FFC35C;--on-accent:#1A1300;--green:#4ADE80;--green-bg:#1B3326;
  --red:#F87171;--red-bg:#3A1D1D;--amber-bg:#3A2E14;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:460px minmax(0,1fr);gap:28px;padding:20px 28px}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col:first-child{overflow-y:auto;overflow-x:hidden;padding-right:2px}
.col:first-child>*{flex-shrink:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px}
.lbl{font-size:13px;font-weight:700;color:var(--text2)}
.hint{font-size:12px;color:var(--muted)}

/* zaglavlje */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.hdr b{display:block;font-size:21px}

/* link + pregled */
.link{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:stretch}
textarea{width:100%;height:90px;resize:none;border-radius:12px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI",sans-serif;padding:10px 12px;white-space:pre-wrap;word-break:break-all;overflow:auto;user-select:text}
textarea::placeholder{color:var(--dim)}
.tile{position:relative;width:160px;height:90px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--dim);font-size:12px}
.tile.has{border:1px solid var(--border2);cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .badge{position:absolute;right:6px;bottom:6px;background:rgba(14,16,20,.88);color:var(--text);font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.tile .yt{position:absolute;left:6px;bottom:6px;width:26px;height:18px;border-radius:5px;background:rgba(14,16,20,.88);display:flex;align-items:center;justify-content:center}
.stack::before,.stack::after{content:"";position:absolute;left:8px;right:8px;height:4px;border-radius:4px 4px 0 0;background:var(--border2);top:-5px}
.stack::after{left:16px;right:16px;top:-9px;background:var(--border)}
.tile-wrap{position:relative;padding-top:9px;margin-top:-9px}
.spin{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btns{display:flex;gap:10px}
.b-chip{flex:1;height:38px;border-radius:12px;border:none;background:var(--chip);color:var(--text);font-size:13px;font-weight:700}
.b-chip:hover{background:var(--chip-h)}
.b-ghost{height:38px;padding:0 18px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px}
.b-ghost:hover{background:var(--active)}
.pstat{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:18px}
.pstat.ok{color:var(--text2)}.pstat.err{color:var(--red)}

/* segmenti */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px}
.seg button{height:34px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:14px;font-weight:700}
.seg button:hover{background:var(--hover)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.mt18{margin-top:14px}.mt16{margin-top:12px}.mb8{margin-bottom:8px}.mt6{margin-top:6px}

/* prekidači */
.sws{padding:2px 16px}
.sw-row{display:flex;align-items:center;justify-content:space-between;min-height:42px;font-size:14px;cursor:pointer}
.sw-row+.sw-row{border-top:1px solid var(--border)}
.sw{appearance:none;margin:0;width:46px;height:24px;border-radius:12px;background:#2B303A;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#E6E8EB;transition:left .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:25px}

.dir{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:13px}
.dir span:nth-child(2){flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.b-link{height:36px;padding:0 8px;border:none;background:transparent;color:var(--accent);font-size:13px;font-weight:700}
.b-link:hover{color:var(--accent-h)}
.go{flex:none;margin-top:auto;height:52px;border-radius:16px;border:none;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.go:hover{background:var(--accent-h)}
.go:disabled{opacity:.5;cursor:default;background:var(--accent)}

/* desno */
.prog{padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between}
.count{font-size:42px;font-weight:700;line-height:1}.count small{font-size:24px;color:var(--dim)}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent);width:0;transition:width .3s}
.step{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{list-style:none;margin:0;padding:0 6px 0 0;display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;min-height:0}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:48px 16px;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 14px 8px 10px;flex:none}
.st{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.th{position:relative;width:96px;height:54px;border-radius:8px;overflow:hidden;background:var(--bg);flex:none;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.th:hover img{transform:scale(1.05)}
.tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.tx .t{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[data-state="active"]{background:var(--active);border-color:var(--accent)}
.row[data-state="active"] .st{background:var(--amber-bg);color:var(--accent)}
.row[data-state="active"] .t{color:var(--text);font-weight:600}
.row[data-state="active"] .s{color:var(--text2)}
.row[data-state="done"] .st{background:var(--green-bg);color:var(--green)}
.row[data-state="done"] .t{color:var(--text)}
.row[data-state="skip"] .st{color:var(--text2)}
.row[data-state="error"] .st{background:var(--red-bg);color:var(--red)}
.row[data-state="error"] .s{color:var(--red)}
.foot{display:flex;gap:10px;margin-top:14px}
.b-big{height:52px;border-radius:14px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:14px;font-weight:700;padding:0 18px}
.b-big:hover:not(:disabled){background:var(--active)}
.b-big:disabled{opacity:.45;cursor:default}

/* plutajući YouTube player (hover) */
.hp{position:fixed;z-index:50;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px var(--border2);
  transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
.hp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hp .pl{position:absolute;inset:0}
.hp .pl iframe{width:100%;height:100%;border:0;display:block}
.hp .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:rgba(14,16,20,.9);font-size:12px;color:var(--text2)}
/* gumb za velika slova */
.b-aa{margin-left:auto;height:40px;min-width:52px;padding:0 12px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:16px;font-weight:800}
.b-aa:hover{background:var(--active)}
.b-aa[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* VELIKA SLOVA (za slabiji vid) */
body.big{font-size:18px;--muted:#C2C7D0;--text2:#E3E6EA;--dim:#9AA0AB;--border2:#4A5060}
.big .app{grid-template-columns:560px minmax(0,1fr);gap:32px;padding:24px 32px}
.big .lbl{font-size:18px}
.big .hint{font-size:16px}
.big .hdr{margin-bottom:16px}
.big .logo{width:54px;height:54px;border-radius:14px}
.big .logo svg{width:32px;height:32px}
.big .hdr b{font-size:30px}
.big .b-aa{height:52px;min-width:64px;font-size:22px}
.big .link{padding:16px 18px;gap:12px}
.big .link-row{grid-template-columns:minmax(0,1fr) 192px}
.big textarea{height:108px;font-size:18px;padding:12px 14px}
.big .tile{width:192px;height:108px;font-size:15px}
.big .tile .badge{font-size:14px;padding:4px 9px}
.big .b-chip,.big .b-ghost{height:52px;font-size:18px}
.big .pstat{font-size:17px;min-height:24px}
.big .seg button{height:50px;font-size:20px}
.big .sw-row{min-height:58px;font-size:19px}
.big .sw{width:60px;height:32px;border-radius:16px}
.big .sw::after{width:26px;height:26px}
.big .sw:checked::after{left:31px}
.big .dir{font-size:17px;margin:10px 0 14px}
.big .b-link{height:48px;font-size:18px}
.big .go{height:72px;font-size:26px;border-radius:18px}
.big .go svg{width:28px;height:28px}
.big .prog{padding:22px 24px 20px;gap:12px}
.big .count{font-size:58px}.big .count small{font-size:32px}
.big #pct{font-size:20px!important}
.big .bar,.big .bar i{height:12px;border-radius:6px}
.big .step{font-size:18px}
.big .list{gap:10px}
.big .empty{font-size:18px}
.big .row{padding:10px 16px 10px 12px;gap:14px}
.big .st{width:46px;height:46px;font-size:16px}
.big .th{width:128px;height:72px;border-radius:10px}
.big .tx .t{font-size:19px}
.big .tx .s{font-size:16px}
.big .b-big{height:66px;font-size:19px}
.big .foot .b-big:last-child{width:200px!important}
.big .hp .msg{font-size:16px}
.big .long{display:none}

@media (prefers-reduced-motion:reduce){.hp,.th img,.bar i,.sw::after{transition:none}}
</style>
</head>
<body>
<div class="app">

<div class="col">
  <header class="hdr">
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1300" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div><b>MP3 Skidač</b><span class="hint">Ista glasnoća za svaku pjesmu</span></div>
    <button class="b-aa" id="aa" aria-pressed="false" title="Velika slova" aria-label="Velika slova">Aa</button>
  </header>

  <section class="card link">
    <label class="lbl" for="links">Link pjesme ili playliste</label>
    <div class="link-row">
      <textarea id="links" spellcheck="false" placeholder="Zalijepi YouTube link ovdje…&#10;(može više linkova, svaki u novi red)"></textarea>
      <div class="tile-wrap" id="tileWrap"><div class="tile" id="tile" aria-live="polite">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
        <span>Pregled</span>
      </div></div>
    </div>
    <div class="btns">
      <button class="b-chip" id="paste">Zalijepi</button>
      <button class="b-ghost" id="clear">Očisti</button>
    </div>
    <div class="pstat" id="pstat"></div>
  </section>

  <div class="lbl mt18 mb8">Glasnoća (LUFS)</div>
  <div class="card seg" role="radiogroup" aria-label="Glasnoća" data-key="lufs">
    <button role="radio" data-v="-9">−9</button><button role="radio" data-v="-11">−11</button><button role="radio" data-v="-14">−14</button><button role="radio" data-v="-16">−16</button>
  </div>
  <div class="hint mt6">−14 je standard za Spotify i YouTube</div>

  <div class="lbl mt16 mb8">Kvaliteta MP3 (kbps)</div>
  <div class="card seg" role="radiogroup" aria-label="Kvaliteta" data-key="bitrate">
    <button role="radio" data-v="320k">320</button><button role="radio" data-v="256k">256</button><button role="radio" data-v="192k">192</button><button role="radio" data-v="128k">128</button>
  </div>

  <section class="card sws mt18">
    <label class="sw-row">Numeriraj redom (01, 02…)<input class="sw" type="checkbox" data-key="numbering"></label>
    <label class="sw-row">Playlista u svoj folder<input class="sw" type="checkbox" data-key="subfolder"></label>
    <label class="sw-row">Preskoči postojeće<input class="sw" type="checkbox" data-key="skip"></label>
  </section>

  <div class="dir"><span class="hint">Spremi u:</span><span id="dir" title=""></span><button class="b-link" id="pick">Promijeni</button></div>

  <button class="go" id="go">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    <span id="goTxt">Skini</span>
  </button>
</div>

<div class="col">
  <section class="card prog">
    <div class="prog-top"><span class="count"><span id="cur">0</span><small> / <span id="tot">0</span></small></span><span class="hint" id="pct" style="font-size:14px;color:var(--text2)">0 %</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="step" id="step">Zalijepi link i klikni Skini.</div>
  </section>
  <div class="lbl mt18 mb8" style="padding-left:4px">Redoslijed</div>
  <ul class="list" id="list"><li class="empty">Kad zalijepiš link, ovdje se pojave pjesme.<br>Pređi mišem preko sličice za pregled.</li></ul>
  <div class="foot">
    <button class="b-big" id="stop" style="flex:1" disabled>■&nbsp;&nbsp; Zaustavi<span class="long"> nakon ove pjesme</span></button>
    <button class="b-big" id="open" style="width:160px">Otvori folder</button>
  </div>
</div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const CFG = { out_dir: "", lufs: "-14", bitrate: "320k", numbering: true, subfolder: true, skip: true };
const COLORS = { text2: "var(--text2)", muted: "var(--muted)", red: "var(--red)", green: "var(--green)", accent: "var(--accent)" };
const GLYPH = { active: "…", done: "✓", skip: "↷", error: "✗" };
let api = null, running = false, rows = [], seq = 0, debounce = null, lastText = "";

const thumb = (id) => id ? `https://i.ytimg.com/vi/${id}/mqdefault.jpg` : "";
const ytId = (u) => { const m = /(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/.exec(u || ""); return m ? m[1] : ""; };
const urls = () => $("links").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- postavke ---------- */
function applyCfg() {
  document.querySelectorAll(".seg").forEach(seg => {
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.v === CFG[seg.dataset.key])));
  });
  document.querySelectorAll(".sw").forEach(sw => sw.checked = !!CFG[sw.dataset.key]);
  $("dir").textContent = "‎" + CFG.out_dir;
  $("dir").title = CFG.out_dir;
}
function saveCfg() { api && api.save(CFG); }
document.querySelectorAll(".seg").forEach(seg => seg.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || running) return;
  CFG[seg.dataset.key] = b.dataset.v; applyCfg(); saveCfg();
}));
document.querySelectorAll(".sw").forEach(sw => sw.addEventListener("change", () => { CFG[sw.dataset.key] = sw.checked; saveCfg(); }));
$("pick").onclick = async () => { if (!api) return; const d = await api.pick_dir(CFG.out_dir); if (d) { CFG.out_dir = d; applyCfg(); saveCfg(); } };
$("open").onclick = () => api && api.open_dir(CFG.out_dir);

/* ---------- link -> pregled ---------- */
function setTile(mode, data = {}) {
  const t = $("tile"), w = $("tileWrap");
  t.className = "tile"; w.classList.remove("stack"); delete t.dataset.vid; t.removeAttribute("role"); t.removeAttribute("aria-label"); t.tabIndex = -1;
  if (mode === "empty") {
    t.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span>Pregled</span>`;
  } else if (mode === "loading" && !data.id) {
    t.innerHTML = `<div class="spin"></div><span>Čitam link…</span>`;
  } else {
    t.classList.add("has");
    if (data.count > 1) w.classList.add("stack");
    t.dataset.vid = data.id || ""; t.dataset.scale = "1.7";
    t.setAttribute("role", "button"); t.tabIndex = 0; t.setAttribute("aria-label", "Pregled videa");
    t.innerHTML = `<img alt="" src="${thumb(data.id)}">` +
      `<span class="yt" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>` +
      (mode === "loading" ? `<span class="badge">…</span>` : data.count > 1 ? `<span class="badge">${data.count} pjesama</span>` : "");
  }
}
function setPstat(text, cls = "") { const p = $("pstat"); p.className = "pstat " + cls; p.textContent = text; }

function renderRows(items, sub = "Spremno") {
  closeHp(true);
  const list = $("list"); rows = [];
  if (!items.length) { list.innerHTML = `<li class="empty">Kad zalijepiš link, ovdje se pojave pjesme.<br>Pređi mišem preko sličice za pregled.</li>`; return; }
  const w = Math.max(2, String(items.length).length);
  list.innerHTML = items.map((it, i) => {
    const n = String(i + 1).padStart(w, "0");
    return `<li class="row" data-state="wait" data-n="${n}"><div class="st">${n}</div>` +
      `<div class="th" ${it.id ? `data-vid="${esc(it.id)}" data-scale="2.6" role="button" tabindex="0" aria-label="Pregled: ${esc(it.title)}"` : ""}>${it.id ? `<img alt="" loading="lazy" src="${thumb(it.id)}">` : ""}</div>` +
      `<div class="tx"><div class="t">${esc(it.title || "Učitavam naziv…")}</div><div class="s">${esc(sub)}</div></div></li>`;
  }).join("");
  rows = [...list.children];
}
function setRow(i, state, title, sub) {
  const r = rows[i]; if (!r) return;
  r.dataset.state = state;
  r.querySelector(".st").textContent = GLYPH[state] || r.dataset.n;
  if (title) r.querySelector(".t").textContent = title;
  if (sub != null) r.querySelector(".s").textContent = sub;
  if (state === "active") r.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function analyze() {
  const text = urls().join("\n");
  if (text === lastText) return;
  lastText = text;
  const my = ++seq;
  if (!text) { setTile("empty"); setPstat(""); renderRows([]); updateGo(0); return; }
  const firstId = ytId(urls()[0]);
  setTile("loading", { id: firstId });
  setPstat("Čitam link…");
  if (!api) return;
  const r = await api.preview(text);
  if (my !== seq) return;
  const items = r.items || [];
  const first = items[0] ? items[0].id : firstId;
  if (items.length) setTile("ready", { id: first, count: items.length }); else setTile("empty");
  renderRows(items);
  updateGo(items.length);
  if (r.errors && r.errors.length) setPstat(items.length ? `${items.length} pjesama · ${r.errors.length} link(a) nije moguće pročitati` : "Link nije moguće pročitati", "err");
  else if (r.playlists && r.playlists.length === 1 && urls().length === 1) setPstat(`Playlista: ${r.playlists[0].title} · ${items.length} pjesama`, "ok");
  else setPstat(items.length === 1 ? (items[0].title || "1 pjesma") : `${items.length} pjesama`, "ok");
}
function scheduleAnalyze(ms = 600) { clearTimeout(debounce); debounce = setTimeout(analyze, ms); }
function updateGo(n) { $("goTxt").textContent = n > 1 ? `Skini ${n} pjesama` : "Skini"; }

$("links").addEventListener("input", () => scheduleAnalyze());
$("links").addEventListener("paste", () => scheduleAnalyze(50));
$("paste").onclick = async () => {
  let t = "";
  try { t = api ? await api.paste() : ""; } catch (e) {}
  if (!t) { try { t = await navigator.clipboard.readText(); } catch (e) {} }
  t = (t || "").trim(); if (!t) return;
  const v = $("links").value.replace(/\s+$/, "");
  $("links").value = (v ? v + "\n" : "") + t + "\n";
  scheduleAnalyze(50);
};
$("clear").onclick = () => { $("links").value = ""; scheduleAnalyze(0); };

/* ---------- skidanje ---------- */
function setStatus(text, color = "text2") { $("step").textContent = text; $("step").style.color = COLORS[color] || COLORS.text2; }
function setProgress(cur, done, total) {
  $("cur").textContent = cur; $("tot").textContent = total;
  const p = total ? done / total : 0;
  $("bar").style.width = (p * 100) + "%"; $("pct").textContent = Math.round(p * 100) + " %";
}
function setRunning(on) {
  running = on;
  $("go").disabled = on; $("stop").disabled = !on;
  $("links").readOnly = on; $("paste").disabled = on; $("clear").disabled = on;
}
$("go").onclick = async () => {
  if (!api || running) return;
  if (!urls().length) { setPstat("Zalijepi barem jedan link.", "err"); $("links").focus(); return; }
  setRunning(true); setProgress(0, 0, 0);
  const ok = await api.start(Object.assign({}, CFG, { text: urls().join("\n") }));
  if (!ok) { setRunning(false); setStatus("Ne mogu pokrenuti — nedostaje yt-dlp ili ffmpeg. Ponovo instaliraj program.", "red"); }
};
$("stop").onclick = () => { if (!api) return; api.stop(); $("stop").disabled = true; setStatus("Zaustavljam nakon trenutne pjesme…", "accent"); };

window.onEvent = (e) => {
  switch (e.kind) {
    case "status": setStatus(e.text, e.color); break;
    case "info": if (!running) setStatus(e.text, "muted"); break;
    case "jobs": renderRows(e.items, "Čeka"); break;
    case "row": setRow(e.i, e.state, e.title, e.sub); break;
    case "progress": setProgress(e.cur, e.done, e.total); break;
    case "done": setRunning(false); break;
  }
};

/* ---------- plutajući YouTube pregled (hover) ---------- */
const HP = { el: null, src: null, player: null, openT: null, closeT: null, pending: null, closing: false };
let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise((res) => {
    if (window.YT && window.YT.Player) return res();
    window.onYouTubeIframeAPIReady = () => res();
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.async = true;
    s.onerror = () => { ytReady = null; res(); };
    document.head.appendChild(s);
  });
  return ytReady;
}
function openHp(src) {
  const id = src.dataset.vid; if (!id) return;
  closeHp(true);
  const r = src.getBoundingClientRect();
  const scale = parseFloat(src.dataset.scale || "1.7");
  let w = Math.max(document.body.classList.contains("big") ? 400 : 280, r.width * scale), h = w * 9 / 16;
  let left = src.classList.contains("tile") ? r.left + r.width / 2 - w / 2 : r.left - 8;
  let top = r.top + r.height / 2 - h / 2;
  left = Math.min(Math.max(12, left), innerWidth - w - 12);
  top = Math.min(Math.max(12, top), innerHeight - h - 12);
  const el = document.createElement("div");
  el.className = "hp";
  Object.assign(el.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  el.innerHTML = `<img alt="" src="${thumb(id)}"><div class="pl"><div id="hpPlayer"></div></div>`;
  document.body.appendChild(el);
  HP.el = el; HP.src = src;
  requestAnimationFrame(() => requestAnimationFrame(() => Object.assign(el.style, { left: left + "px", top: top + "px", width: w + "px", height: h + "px" })));
  el.addEventListener("mouseenter", () => { clearTimeout(HP.closeT); HP.closing = false; });
  el.addEventListener("mouseleave", (ev) => { if (!el.contains(ev.relatedTarget)) { HP.closing = true; scheduleClose(); } });
  loadYT().then(() => {
    if (HP.el !== el) return;
    if (!(window.YT && window.YT.Player)) { showHpMsg(el, "Pregled nije dostupan (nema interneta?)"); return; }
    HP.player = new YT.Player("hpPlayer", {
      host: "https://www.youtube-nocookie.com", videoId: id, width: "100%", height: "100%",
      playerVars: { autoplay: 1, mute: 1, controls: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, fs: 1, origin: location.origin },
      events: {
        onReady: (ev) => { try { ev.target.mute(); ev.target.playVideo(); } catch (e) {} },
        onError: () => { if (HP.el === el) { el.querySelector(".pl").style.display = "none"; showHpMsg(el, "Vlasnik ne dozvoljava pregled ovog videa izvan YouTubea."); } }
      }
    });
  });
}
function showHpMsg(el, text) { const m = document.createElement("div"); m.className = "msg"; m.textContent = text; el.appendChild(m); }
function closeHp(now) {
  clearTimeout(HP.closeT); clearTimeout(HP.openT); HP.pending = null; HP.closing = false;
  if (!HP.el) return;
  const el = HP.el, player = HP.player;
  HP.el = null; HP.src = null; HP.player = null;
  try { player && player.destroy(); } catch (e) {}
  if (now) { el.remove(); return; }
  el.style.opacity = "0"; el.style.transition = "opacity .12s"; setTimeout(() => el.remove(), 130);
}
function scheduleClose() { clearTimeout(HP.closeT); HP.closeT = setTimeout(() => closeHp(false), 180); }

document.addEventListener("mouseover", (e) => {
  const src = e.target.closest("[data-vid]");
  if (!src || !src.dataset.vid || src === HP.src || src === HP.pending) return;
  clearTimeout(HP.openT); HP.pending = src;
  HP.openT = setTimeout(() => { if (HP.pending === src) { HP.pending = null; openHp(src); } }, 350);
});
document.addEventListener("mouseout", (e) => {
  const src = e.target.closest("[data-vid]");
  if (src && src === HP.pending && !src.contains(e.relatedTarget)) { clearTimeout(HP.openT); HP.pending = null; }
});
document.addEventListener("mousemove", (e) => {
  if (!HP.el) return;
  const r = HP.el.getBoundingClientRect();
  const inside = e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4;
  if (inside) { clearTimeout(HP.closeT); HP.closing = false; }
  else if (!HP.closing) { HP.closing = true; scheduleClose(); }
});
document.addEventListener("click", (e) => {
  const src = e.target.closest("[data-vid]");
  if (src && src.dataset.vid && src !== HP.src) { clearTimeout(HP.openT); HP.pending = null; openHp(src); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeHp(false);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-vid]")) { e.preventDefault(); openHp(e.target); }
});
$("list").addEventListener("scroll", () => closeHp(true), { passive: true });
window.addEventListener("resize", () => closeHp(true));

/* ---------- velika slova ---------- */
function setBig(on) {
  document.body.classList.toggle("big", !!on);
  $("aa").setAttribute("aria-pressed", String(!!on));
  closeHp(true);
}
$("aa").onclick = () => {
  const on = !document.body.classList.contains("big");
  setBig(on);
  if (api && api.set_big) api.set_big(on);
};

/* ---------- start ---------- */
async function boot() {
  api = window.pywebview && window.pywebview.api;
  if (!api) return;
  const r = await api.init();
  Object.assign(CFG, r.config || {});
  applyCfg();
  setBig(r.big);
  if (r.missing && r.missing.length) setStatus("Nedostaje: " + r.missing.join(", ") + ". Ponovo instaliraj program.", "red");
  if (urls().length) { lastText = ""; analyze(); }
}
applyCfg();
if (window.pywebview && window.pywebview.api) boot(); else window.addEventListener("pywebviewready", boot);
</script>
