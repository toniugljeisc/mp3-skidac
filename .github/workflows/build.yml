name: Napravi Windows instalaciju

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview pillow
          python app/make_icon.py
          pyinstaller --noconfirm --windowed --name "MP3 Skidac" --icon app/icon.ico --add-data "app/ui;ui" --collect-all webview app/mp3_skidac.py

      - name: yt-dlp i FFmpeg
        shell: pwsh
        run: |
          $dst = "dist/MP3 Skidac"
          Copy-Item app/icon.ico $dst
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$dst/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName "$dst/ffmpeg.exe"
          & "$dst/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & "$dst/yt-dlp.exe" --version

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=1.1.${{ github.run_number }}" installer/setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Skidac-Setup
          path: output/MP3-Skidac-Setup.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: MP3 Skidač 1.1.${{ github.run_number }}
          files: output/MP3-Skidac-Setup.exe
