name: Napravi instalacije (Windows + Mac)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview pillow
          python app/make_icon.py
          pyinstaller --noconfirm --windowed --name "MP3 Skidac" --icon app/icon.ico --add-data "app/ui;ui" --collect-all webview app/mp3_skidac.py

      - name: yt-dlp i FFmpeg
        shell: pwsh
        run: |
          $dst = "dist/MP3 Skidac"
          Copy-Item app/icon.ico $dst
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$dst/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName "$dst/ffmpeg.exe"
          & "$dst/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & "$dst/yt-dlp.exe" --version
          Copy-Item -Recurse "dist/MP3 Skidac" "dist/MP3 Skidac Veliki"
          Rename-Item "dist/MP3 Skidac Veliki/MP3 Skidac.exe" "MP3 Skidac Veliki.exe"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=1.3.${{ github.run_number }}" installer/setup.iss
          & $iscc "/DAppVersion=1.3.${{ github.run_number }}" /DBig installer/setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            output/MP3-Skidac-Setup.exe
            output/MP3-Skidac-Veliki-Setup.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: yt-dlp i FFmpeg (Apple Silicon)
        run: |
          mkdir -p bin
          curl -fsSL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          curl -fsSL -o ffmpeg.gz https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64.gz
          gunzip -c ffmpeg.gz > bin/ffmpeg
          chmod +x bin/yt-dlp bin/ffmpeg
          codesign --force -s - bin/ffmpeg || true
          bin/ffmpeg -hide_banner -version | head -1
          bin/yt-dlp --version

      - name: PyInstaller (.app)
        run: |
          python -m pip install --upgrade pip pyinstaller pywebview pillow
          python app/make_icon.py
          pyinstaller --noconfirm --windowed --name "MP3 Skidac" --icon app/icon.icns \
            --osx-bundle-identifier ba.baron.mp3skidac \
            --add-data "app/ui:ui" --add-data "bin/yt-dlp:." --add-data "bin/ffmpeg:." \
            --collect-all webview app/mp3_skidac.py
          ls "dist/MP3 Skidac.app/Contents/Resources" | head -50

      - name: DMG
        run: |
          mkdir -p dmg output
          cp -R "dist/MP3 Skidac.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "MP3 Skidac" -srcfolder dmg -ov -format UDZO output/MP3-Skidac-Mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: output/MP3-Skidac-Mac.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: MP3 Skidač 1.3.${{ github.run_number }}
          files: |
            out/MP3-Skidac-Setup.exe
            out/MP3-Skidac-Veliki-Setup.exe
            out/MP3-Skidac-Mac.dmg
